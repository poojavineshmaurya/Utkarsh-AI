<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Utkarsh AI</title>
  <style>
    body {
      font-family: Arial;
      background: #101827;
      color: white;
      text-align: center;
      padding: 20px;
    }
    h1 { color: #38bdf8; }
    input {
      padding: 14px;
      width: 85%;
      border-radius: 10px;
      border: none;
    }
    button {
      padding: 14px 25px;
      background: #0284c7;
      color: white;
      border: none;
      border-radius: 10px;
      margin-top: 12px;
    }
    #answer {
      margin-top: 25px;
      padding: 15px;
    }
  </style>
</head>
<body>
  <h1>Utkarsh AI</h1>
  <p>My Personal AI Chatbot Platform</p>
  <input id="question" placeholder="Ask me anything...">
  <br>
  <button onclick="ask()">Ask AI</button>
  <div id="answer"></div>

  <script>
    function ask() {
      let q = document.getElementById("question").value;
      if (!q.trim()) return;
      document.getElementById("answer").innerText =
        "Welcome to Utkarsh AI! You asked: " + q;
    }
  </script>
</body>
</html>
